# agent-shit-cleaner config example
# Copy to ~/.config/asc/config.toml and edit as needed; every key is optional.
# TOML scoping note: top-level scalar keys (tier_b etc.) must come BEFORE any [table].

# Tier B rules (ambiguous dir names like dist/build/out/coverage/.cache) are
# off by default; enable to include them in scans (still requires explicit
# selection when cleaning — never auto-deleted)
tier_b = false

# Activity window (days): a project whose source files were modified within
# this window is "active" and its workspace junk is skipped by default
# (TUI marks it ⚡active; CLI needs --include-active)
active_days = 30

# Workspace roots scanned by the TUI (`asc`) and `asc clean` when no paths given
[[workspace]]
root = "~/Documents"
# optional: subdirectory names to skip (e.g. manually maintained dependency trees)
# ignore = ["vendored", "third_party"]

# Per-rule retention overrides (only meaningful for retention-risk rules)
[keep_days]
"claude-code/sessions" = 90
# "codex/sessions" = 30

# ── user-defined rules ──
# Put files in ~/.config/asc/rules.d/*.toml (loaded in filename order);
# same id overrides a builtin rule, otherwise it's appended.
# Same format as rules/rules.toml, e.g.:
#
# [[rule]]
# id = "workspace/mycorp"          # your id
# scope = "workspace"
# match_dir = "mycorp-cache"       # directory name (supports {a,b} alternatives)
# require_sibling = "go.mod"       # optional: manifest that must exist next to it (supports * wildcards)
# category = "caches"              # sessions/logs/caches/telemetry/packages/temp/build
# risk = "safe"                    # safe=regenerable / retention=keep N days / redownload=re-fetchable
# keep_days = 30                   # applies when risk = retention
# description = "internal tooling cache"
