# agent-shit-cleaner 配置示例
# 复制到 ~/.config/asc/config.toml 按需修改；所有键均可省略。
# 注意 TOML 作用域：顶层的标量键（tier_b 等）必须写在任何 [表] 之前。

# Tier B 规则（dist/build/out/coverage/.cache 这类名字歧义的目录）默认关闭；
# 开启后才会参与扫描（仍需在清理时显式勾选，不会自动删）
tier_b = false

# 活跃判定窗口（天）：项目内源文件 mtime 距今小于该值 → 项目"活跃"，
# 其工作区垃圾默认跳过（TUI 标 ⚡活跃项目，CLI 需 --include-active 才清理）
active_days = 30

# 回收站保留天数（asc trash empty --expired 按此判定过期）
trash_keep_days = 7

# 工作区根：TUI（asc）与 asc clean 不带路径时自动扫描这些根
[[workspace]]
root = "~/Documents"
# 可选：跳过的子目录名（如手工维护的依赖树）
# ignore = ["vendored", "third_party"]

# 按规则 id 覆盖保留天数（只对 retention 类规则有意义）
[keep_days]
"claude-code/sessions" = 90
# "codex/sessions" = 30

# ── 用户自定义规则 ──
# 放 ~/.config/asc/rules.d/*.toml（按文件名排序加载），与内置规则同 id 则覆盖、
# 否则追加。格式同 rules/rules.toml，示例：
#
# [[rule]]
# id = "workspace/mycorp"          # 自定 id
# scope = "workspace"
# match_dir = "mycorp-cache"       # 目录名（支持 {a,b} 多选）
# require_sibling = "go.mod"       # 可选：同级需存在的清单文件（支持 * 通配）
# category = "caches"              # sessions/logs/caches/telemetry/packages/temp/build
# risk = "safe"                    # safe=可再生 / retention=按保留期 / redownload=可重下
# keep_days = 30                   # retention 时生效
# description = "公司内部工具缓存"
