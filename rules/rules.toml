# ────────────── Agent 大本营：Windsurf（M3，路径已核实） ──────────────
# 官方文档/issue 证实 ~/.codeium/windsurf/implicit 是 Cascade 聊天记录（.pb）；
# memories/ 是记忆库（有价值，不加规则）；编辑器本体缓存在
# ~/Library/Application Support/Windsurf，与 VSCode 系同构，暂不覆盖。

[[rule]]
id = "windsurf/implicit-chats"
scope = "home"
agent = "windsurf"
path = "~/.codeium/windsurf/implicit"
category = "sessions"
risk = "retention"
keep_days = 90
description = "Cascade 聊天记录（.pb）"

# ────────────── Agent 大本营：Continue（M3，路径已核实） ──────────────
# 官方 issue #4309/#7337：~/.continue 可膨胀到 30G，主要是 sessions 与 codebase 索引。

[[rule]]
id = "continue/sessions"
scope = "home"
agent = "continue"
path = "~/.continue/sessions"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话记录（含 promptLogs，可膨胀到数十 G）"

[[rule]]
id = "continue/session-db"
scope = "home"
agent = "continue"
path = "~/.continue/session.sqlite"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话数据库"

[[rule]]
id = "continue/index"
scope = "home"
agent = "continue"
path = "~/.continue/index"
category = "caches"
risk = "redownload"
description = "代码库索引（清理后自动重建）"

# ────────────── Agent 大本营：Goose（M3，路径已核实） ──────────────
# ~/.config/goose 是配置+secrets，永不加规则；数据在 XDG data/state。

[[rule]]
id = "goose/sessions"
scope = "home"
agent = "goose"
path = "~/.local/share/goose/sessions"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话记录"

[[rule]]
id = "goose/logs"
scope = "home"
agent = "goose"
path = "~/.local/state/goose/logs"
category = "logs"
risk = "retention"
keep_days = 30
description = "运行日志"

# ────────────── Agent 大本营：Crush（M3，路径已核实） ──────────────
# 官方 README：~/.local/share/crush 仅存 JSON 状态（会话）；
# ~/.config/crush 是配置（含 API key），不加规则。

[[rule]]
id = "crush/sessions"
scope = "home"
agent = "crush"
path = "~/.local/share/crush"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话 JSON 状态"

# ────────────── Agent 大本营：Amp（M3，路径已核实） ──────────────
# threads 是服务端会话的本地镜像（allaboutcoding 考证）；
# 同目录的 secrets.json 不在规则路径内，永不被触碰。

[[rule]]
id = "amp/threads"
scope = "home"
agent = "amp"
path = "~/.local/share/amp/threads"
category = "sessions"
risk = "retention"
keep_days = 90
description = "线程本地镜像（T-*.json，服务端才是源）"

# ────────────── Agent 大本营：Copilot CLI（M3，路径已核实） ──────────────
# 官方文档：~/.copilot/session-state 是完整会话记录；
# ~/.copilot 根下的 config.json/mcp-config.json 是配置，不加规则。

[[rule]]
id = "copilot/session-state"
scope = "home"
agent = "copilot"
path = "~/.copilot/session-state"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话状态（每会话一个子目录）"

# ────────────── Agent 大本营：Qwen Code（M4，官方文档核实） ──────────────
# 项目级 <project>/.qwen/ 是配置+QWEN.md 提示词（有价值），不加规则；
# 用户级 ~/.qwen 下的 tmp/debug/projects/resources 才是可再生数据。
# ~/.qwen/settings.json 不在任何规则路径内。

[[rule]]
id = "qwen/tmp"
scope = "home"
agent = "qwen"
path = "~/.qwen/tmp"
category = "temp"
risk = "safe"
keep_days = 7
description = "临时文件"

[[rule]]
id = "qwen/debug"
scope = "home"
agent = "qwen"
path = "~/.qwen/debug"
category = "logs"
risk = "retention"
keep_days = 30
description = "调试日志"

[[rule]]
id = "qwen/projects"
scope = "home"
agent = "qwen"
path = "~/.qwen/projects"
category = "sessions"
risk = "retention"
keep_days = 90
description = "项目会话状态"

[[rule]]
id = "qwen/resources"
scope = "home"
agent = "qwen"
path = "~/.qwen/resources"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话资源（resources/<sessionId>）"

# ────────────── 工作区 Tier A（项目内目录名模式） ──────────────

[[rule]]
id = "workspace/node-modules"
scope = "workspace"
match_dir = "node_modules"
require_sibling = "package.json"
category = "build"
risk = "redownload"
description = "npm/pnpm/yarn 依赖（可重装）"

[[rule]]
id = "workspace/rust-target"
scope = "workspace"
match_dir = "target"
require_sibling = "Cargo.toml"
category = "build"
risk = "redownload"
description = "Rust 构建产物（cargo build 重生）"

[[rule]]
id = "workspace/python-venv"
scope = "workspace"
match_dir = "{.venv,venv}"
require_sibling = "{pyproject.toml,requirements*.txt,setup.py}"
category = "build"
risk = "redownload"
description = "Python 虚拟环境（可重建）"

[[rule]]
id = "workspace/pycache"
scope = "workspace"
match_dir = "__pycache__"
category = "build"
risk = "safe"
description = "Python 字节码缓存"

[[rule]]
id = "workspace/js-build"
scope = "workspace"
match_dir = "{.next,.nuxt,.turbo,.gradle}"
category = "build"
risk = "redownload"
description = "前端/构建缓存"

[[rule]]
id = "workspace/crush-state"
scope = "workspace"
match_dir = ".crush"
category = "sessions"
risk = "retention"
keep_days = 90
description = "项目内 Crush 会话状态（crush 官方项目级数据目录）"

[[rule]]
id = "workspace/specstory"
scope = "workspace"
match_dir = ".specstory"
category = "sessions"
risk = "retention"
keep_days = 90
description = "SpecStory 自动保存的 AI 聊天历史（.specstory/history，Markdown 累积）"

# ────────────── 工作区 Tier B（目录名歧义，默认关闭；config tier_b = true 开启） ──────────────

[[rule]]
id = "workspace/dist"
scope = "workspace"
match_dir = "dist"
require_sibling = "package.json"
tier = "b"
category = "build"
risk = "redownload"
description = "前端打包产物（dist 名字歧义，Tier B）"

[[rule]]
id = "workspace/build"
scope = "workspace"
match_dir = "build"
require_sibling = "{pom.xml,build.gradle*,settings.gradle*,CMakeLists.txt,Makefile}"
tier = "b"
category = "build"
risk = "redownload"
description = "通用构建目录（build 名字歧义，Tier B）"

[[rule]]
id = "workspace/out"
scope = "workspace"
match_dir = "out"
require_sibling = "{package.json,Cargo.toml}"
tier = "b"
category = "build"
risk = "redownload"
description = "构建输出目录（out 名字歧义，Tier B）"

[[rule]]
id = "workspace/coverage"
scope = "workspace"
match_dir = "coverage"
require_sibling = "{package.json,pyproject.toml}"
tier = "b"
category = "build"
risk = "safe"
description = "测试覆盖率产物（Tier B）"

[[rule]]
id = "workspace/dot-cache"
scope = "workspace"
match_dir = ".cache"
tier = "b"
category = "caches"
risk = "redownload"
description = "项目内 .cache 目录（Tier B）"

# ────────────── Agent 大本营：Tencent WorkBuddy ──────────────
