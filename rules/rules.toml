# agent-shit-cleaner 内置规则包
# scope = "home"      固定路径规则（~ 基于 home 展开；pattern 为文件名通配符，仅匹配文件）
# scope = "workspace" 目录名模式规则（作用于项目内任意层级；match_dir 支持 {a,b} 多选）
# risk: safe(可再生) / retention(按 keep_days 过期) / redownload(可再下载，清理需显式确认)
# 注：Tier B（dist/build/out/coverage/.cache）歧义目录默认不收录，待 M2 配置开关。
# 注：用户可在 ~/.config/asc/rules.d/*.toml 追加或覆盖（M2）。

# ────────────── Agent 大本营：Claude Code ──────────────

[[rule]]
id = "claude-code/projects"
scope = "home"
agent = "claude-code"
path = "~/.claude/projects"
pattern = "*.jsonl"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话转录（含完整对话与代码）"

[[rule]]
id = "claude-code/sessions"
scope = "home"
agent = "claude-code"
path = "~/.claude/sessions"
category = "sessions"
risk = "retention"
keep_days = 90
description = "会话状态"

[[rule]]
id = "claude-code/file-history"
scope = "home"
agent = "claude-code"
path = "~/.claude/file-history"
category = "caches"
risk = "retention"
keep_days = 90
description = "文件修改历史（/rewind 依赖）"

[[rule]]
id = "claude-code/shell-snapshots"
scope = "home"
agent = "claude-code"
path = "~/.claude/shell-snapshots"
category = "temp"
risk = "safe"
keep_days = 7
description = "shell 环境快照"

[[rule]]
id = "claude-code/paste-cache"
scope = "home"
agent = "claude-code"
path = "~/.claude/paste-cache"
category = "temp"
risk = "safe"
keep_days = 7
description = "粘贴缓存"

[[rule]]
id = "claude-code/downloads"
scope = "home"
agent = "claude-code"
path = "~/.claude/downloads"
category = "temp"
risk = "safe"
keep_days = 14
description = "下载缓存"

[[rule]]
id = "claude-code/tasks"
scope = "home"
agent = "claude-code"
path = "~/.claude/tasks"
category = "temp"
risk = "retention"
keep_days = 30
description = "任务状态"

[[rule]]
id = "claude-code/backups"
scope = "home"
agent = "claude-code"
path = "~/.claude/backups"
category = "temp"
risk = "retention"
keep_days = 30
description = "备份"

[[rule]]
id = "claude-code/cache"
scope = "home"
agent = "claude-code"
path = "~/.claude/cache"
category = "caches"
risk = "safe"
keep_days = 30
description = "缓存"

